[package]
name = "local-browser-bridge"
version = "0.12.68"
edition = "2024"
description = "A localhost bridge from browser-only agents to Chromium and native computer control"
license = "MIT"
rust-version = "1.88"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
futures-util = "0.3.31"
hmac = "0.12.1"
include_dir = "0.7.4"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "=0.3.47", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
image = { version = "0.25.8", default-features = false, features = ["png"] }
tao = "0.37.0"
tray-icon = "0.24.2"
xcap = "0.9.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = { version = "0.24.0", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5.0"
screencapturekit = { version = "=8.0.1", features = ["macos_14_2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
] }
windows-wgc = { package = "windows", version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"

[build-dependencies]
embed-manifest = "1.5.0"
embed-resource = "3.0.11"

[patch.crates-io]
screencapturekit = { path = "vendor/screencapturekit-8.0.1" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
