[package]
name = "local-browser-bridge"
version = "0.3.0"
edition = "2024"
description = "A standalone localhost bridge between browser-only agents and a Chromium extension"
license = "MIT"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
dirs = "6.0.0"
futures-util = "0.3.31"
include_dir = "0.7.4"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
