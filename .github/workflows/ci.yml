name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust formatting, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Audit distributed versions
        run: bash scripts/audit-versions.sh
      - name: Validate the read-only macOS pointer handoff watcher
        run: |
          node --check scripts/wait-macos-pointer-concurrency-handoff.mjs
          node scripts/wait-macos-pointer-concurrency-handoff.mjs --mode self-test
      - name: Verify locked dependency licenses
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          bash scripts/check-licenses.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reject lint warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run all tests
        run: cargo test --locked --all-targets

  windows:
    name: Windows compile, tests, and artifact policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the minimum supported Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustup target add x86_64-pc-windows-msvc
      - name: Audit distributed versions
        shell: bash
        run: bash scripts/audit-versions.sh
      - name: Validate stock-user Chrome evidence tooling
        shell: pwsh
        run: |
          if ([String]::IsNullOrWhiteSpace($env:SystemRoot) -or
              -not [IO.Path]::IsPathRooted($env:SystemRoot)) {
            throw "The Windows system root is unavailable."
          }
          $windowsPowerShell = [IO.Path]::GetFullPath([IO.Path]::Combine(
            $env:SystemRoot, "System32", "WindowsPowerShell", "v1.0", "powershell.exe"
          ))
          if (-not [IO.File]::Exists($windowsPowerShell) -or
              ([IO.FileInfo]::new($windowsPowerShell).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "The exact system Windows PowerShell executable is unavailable or linked."
          }
          $ps51IdentityCommand = 'Write-Output ("{0}.{1}|{2}" -f $PSVersionTable.PSVersion.Major, $PSVersionTable.PSVersion.Minor, $PSVersionTable.PSEdition)'
          $ps51Identity = @(& $windowsPowerShell -NoLogo -NoProfile -NonInteractive -Command $ps51IdentityCommand)
          if ($LASTEXITCODE -ne 0 -or $ps51Identity.Count -ne 1 -or
              $ps51Identity[0] -cne "5.1|Desktop") {
            throw "The exact system PowerShell self-test host is not Windows PowerShell 5.1 Desktop."
          }
          $scripts = @(
            "scripts/browser-evidence-candidate.ps1",
            "scripts/record-computer-helper-chain.ps1",
            "scripts/sanitize-browser-evidence-screenshot.ps1",
            "scripts/test-windows-browser-api.ps1",
            "scripts/test-windows-computer-use.ps1",
            "scripts/test-windows-stock-chrome.ps1",
            "scripts/verify-windows-artifacts.ps1",
            "scripts/verify-windows-release-candidate.ps1",
            "scripts/wait-windows-foreground-arm-handoff.ps1",
            "scripts/write-browser-evidence-record.ps1",
            "scripts/write-stock-chrome-operator-response.ps1",
            "tests/fixtures/windows/WindowsComputerUseFixture.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw ($errors | ForEach-Object { $_.Message } | Out-String)
            }
          }
          & ./scripts/browser-evidence-candidate.ps1 -Mode SelfTest
          & ./scripts/record-computer-helper-chain.ps1 -Mode SelfTest
          & ./scripts/sanitize-browser-evidence-screenshot.ps1 -Mode SelfTest
          & ./scripts/write-stock-chrome-operator-response.ps1 -Mode SelfTest
          & ./scripts/test-windows-browser-api.ps1 -SelfTest
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/browser-evidence-candidate.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 candidate binder self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/record-computer-helper-chain.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 computer-helper recorder self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/sanitize-browser-evidence-screenshot.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 screenshot sanitizer self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/test-windows-browser-api.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 browser API self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/write-browser-evidence-record.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 browser evidence finalizer self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/write-stock-chrome-operator-response.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 stock-Chrome response writer self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/test-windows-computer-use.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 computer-use self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/verify-windows-artifacts.ps1 -Version 0.0.0 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 artifact verifier self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/verify-windows-release-candidate.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 release-candidate trust self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/test-windows-stock-chrome.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 stock-Chrome coordinator self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./scripts/wait-windows-foreground-arm-handoff.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 foreground-arm handoff self-test failed." }
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -File ./tests/fixtures/windows/WindowsComputerUseFixture.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 fixture self-test failed." }
          & ./scripts/test-windows-computer-use.ps1 -SelfTest
          & ./scripts/wait-windows-foreground-arm-handoff.ps1 -Mode SelfTest
          & ./scripts/write-browser-evidence-record.ps1 -Mode SelfTest
          & ./scripts/write-stock-chrome-operator-response.ps1 -Mode SelfTest
      - name: Check Windows formatting, lint, and tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          cargo test --locked --target x86_64-pc-windows-msvc --all-targets
      - name: Build and inspect standalone Windows executables
        shell: pwsh
        run: |
          cargo build --locked --release --bins --target x86_64-pc-windows-msvc
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/local-browser-bridge.exe "dist/local-browser-bridge-v${version}-windows-x86_64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/local-computer-helper.exe "dist/local-computer-helper-v${version}-windows-x86_64.exe"
          ./scripts/verify-windows-artifacts.ps1 -Version $version -ChecksumManifestPath dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ci-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS formatting, lint, and tests
    # apple-metal 0.8.8's Swift bridge names Metal APIs introduced in the
    # macOS 26 SDK. Artifact inspection still enforces the macOS 13 runtime floor.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the macOS build SDK and runtime floor
        run: bash scripts/verify-macos-build-host.sh
      - name: Validate the macOS pointer handoff watcher on macOS
        run: |
          bash -n scripts/fetch-verify-release-candidate.sh
          node --check scripts/wait-macos-pointer-concurrency-handoff.mjs
          node scripts/wait-macos-pointer-concurrency-handoff.mjs --mode self-test
          node --check scripts/finalize-macos-acceptance.mjs
          node scripts/finalize-macos-acceptance.mjs --self-test
      - name: Validate the macOS packaged-evidence harness
        run: |
          node --check evidence/v0.12.17/computer/helper-evidence-rig.mjs
          node evidence/v0.12.17/computer/helper-evidence-rig.mjs --self-test
          xcrun swiftc -typecheck evidence/v0.12.17/computer/HelperEvidenceFixture.swift
          xcrun swiftc -typecheck evidence/v0.12.17/computer/SystemProbe.swift
          xcrun swiftc -typecheck evidence/v0.12.17/computer/PointerHandoff.swift
          xcrun swiftc evidence/v0.12.17/computer/PointerHandoff.swift -o "$RUNNER_TEMP/lbb-pointer-handoff-self-test"
          "$RUNNER_TEMP/lbb-pointer-handoff-self-test" --self-test
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Check native macOS source and behavior
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  extension:
    name: Extension static and behavior contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Validate the manifest as JSON
        run: python3 -m json.tool extension/manifest.json >/dev/null
      - name: Run extension capability, safety, and protocol contract tests
        run: cargo test --locked --test extension_contract

  package:
    name: Reproducible extension package (Node-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check packaging scripts and versions
        shell: bash
        run: |
          bash -n scripts/*.sh
          bash scripts/audit-versions.sh
      - name: Build the extension twice and compare bytes
        shell: bash
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          bash scripts/package-extension.sh "$stage/first.zip" >/dev/null
          bash scripts/package-extension.sh "$stage/second.zip" >/dev/null
          cmp "$stage/first.zip" "$stage/second.zip"
          unzip -tq "$stage/first.zip"
      - name: Ensure packaging did not mutate tracked source
        run: git diff --exit-code
