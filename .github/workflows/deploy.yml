name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from Cargo.toml (for example, 0.12.31)
        required: true
        type: string
      source_sha:
        description: Exact 40-character origin/main commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.repository }}-${{ inputs.version }}-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_REF: ${{ inputs.source_sha }}

jobs:
  verify:
    name: Verify release candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      attestations: write
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the candidate to exact green main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_SHA" = "$SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(git rev-parse origin/main)" = "$SOURCE_REF"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          git diff --quiet HEAD --
          git diff --cached --quiet
          git fsck --full
          if [[ -e RELEASE_BLOCKED || -L RELEASE_BLOCKED ]]; then
            echo "Release is blocked by RELEASE_BLOCKED." >&2
            exit 1
          fi
          version="$(bash scripts/audit-versions.sh "$RELEASE_VERSION")"
          test "$version" = "$RELEASE_VERSION"
          release_tag="v$version"
          remote_tag="$(git ls-remote --refs origin "refs/tags/$release_tag")"
          test -z "$remote_tag"
          release_index="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 10000 --json tagName)"
          test "$(jq --arg tag "$release_tag" '[.[] | select(.tagName == $tag)] | length' <<<"$release_index")" = 0

          merged_pulls="$(mktemp)"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF/pulls?per_page=100" \
            > "$merged_pulls"
          reviewed_association="$(jq -cer \
            --arg repository "$GITHUB_REPOSITORY" '
              [.[] | select(
                .merged_at != null
                and .base.ref == "main"
                and .base.repo.full_name == $repository
              )]
              | if length == 1 then .[0]
                else error("source must belong to exactly one merged main PR") end
            ' "$merged_pulls")"
          reviewed_number="$(jq -er '
            if (.number | type) == "number" and .number > 0
            then .number | tostring
            else error("associated pull request number is invalid") end
          ' <<<"$reviewed_association")"
          associated_head="$(jq -er '.head.sha' <<<"$reviewed_association")"

          reviewed_pull="$(mktemp)"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/pulls/$reviewed_number" \
            > "$reviewed_pull"
          reviewed_head="$(jq -er \
            --argjson number "$reviewed_number" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg associated_head "$associated_head" '
              if (
                .merged_at != null
                and .number == $number
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.sha == $associated_head
              ) then .head.sha
              else error("pull request detail does not bind the reviewed source") end
            ' "$reviewed_pull")"
          [[ "$reviewed_head" =~ ^[0-9a-f]{40}$ ]]
          reviewed_tree="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/git/commits/$reviewed_head" \
            --jq '.tree.sha')"
          [[ "$reviewed_tree" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$SOURCE_REF^{tree}")" = "$reviewed_tree"

          checks="$(mktemp)"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/commits/$reviewed_head/check-runs?per_page=100" \
            > "$checks"
          jq -e --arg source "$reviewed_head" '
            . as $response
            | ($response.total_count < 100)
            and ([
              "Rust, extension, and packaging",
              "Windows native validation",
              "macOS native validation"
          ] | all(. as $required | any($response.check_runs[];
              .name == $required
              and .head_sha == $source
              and .status == "completed"
              and .conclusion == "success"
              and .app.slug == "github-actions"
            )))
          ' "$checks" >/dev/null
          echo "source_sha=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Audit locked production dependencies
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Self-test the acceptance and package contracts
        shell: bash
        run: |
          bash -n scripts/*.sh
          bash -n scripts/fetch-verify-release-candidate.sh
          bash scripts/fetch-verify-release-candidate.sh --self-test
          bash -n scripts/verify-release-acceptance-evidence.sh
          bash scripts/verify-release-acceptance-evidence.sh --self-test
          bash scripts/publish-release.sh --self-test
          bash scripts/package-extension.sh
      - name: Attest extension build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows x86_64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - name: Install the supported Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add x86_64-pc-windows-msvc
      - name: Build and verify standalone executables
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        shell: pwsh
        run: |
          cargo build --locked --release --bins --target x86_64-pc-windows-msvc
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($version -cne $env:VERIFIED_VERSION) { throw "Source version changed after verification." }
          New-Item -ItemType Directory -Force dist | Out-Null
          $server = "dist/local-browser-bridge-v${version}-windows-x86_64.exe"
          $helper = "dist/local-computer-helper-v${version}-windows-x86_64.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/local-browser-bridge.exe $server
          Copy-Item target/x86_64-pc-windows-msvc/release/local-computer-helper.exe $helper
          ./scripts/verify-windows-artifacts.ps1 -Version $version -ServerPath $server -HelperPath $helper
      - name: Attest Windows build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS universal
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - name: Verify build host and install Rust targets
        shell: bash
        run: |
          bash scripts/verify-macos-build-host.sh
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build and verify universal server and helper app
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          version="$(bash scripts/audit-versions.sh "$VERIFIED_VERSION")"
          cargo build --locked --release --bins --target aarch64-apple-darwin
          cargo build --locked --release --bins --target x86_64-apple-darwin
          mkdir -p dist stage "stage/Local Computer Helper.app/Contents/MacOS"
          cp LICENSE THIRD_PARTY_LICENSES.txt stage/
          chmod 644 stage/LICENSE stage/THIRD_PARTY_LICENSES.txt
          lipo -create \
            target/aarch64-apple-darwin/release/local-browser-bridge \
            target/x86_64-apple-darwin/release/local-browser-bridge \
            -output stage/local-browser-bridge
          lipo -create \
            target/aarch64-apple-darwin/release/local-computer-helper \
            target/x86_64-apple-darwin/release/local-computer-helper \
            -output "stage/Local Computer Helper.app/Contents/MacOS/local-computer-helper"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist.in > "stage/Local Computer Helper.app/Contents/Info.plist"
          chmod 755 stage/local-browser-bridge "stage/Local Computer Helper.app/Contents/MacOS/local-computer-helper"
          codesign --force --sign - stage/local-browser-bridge
          codesign --verify --strict stage/local-browser-bridge
          codesign --force --deep --sign - "stage/Local Computer Helper.app"
          codesign --verify --deep --strict "stage/Local Computer Helper.app"
          bash scripts/verify-macos-artifacts.sh \
            "$version" \
            stage/local-browser-bridge \
            "stage/Local Computer Helper.app/Contents/MacOS/local-computer-helper"
          COPYFILE_DISABLE=1 tar --format ustar --no-xattrs -czf \
            "dist/local-browser-bridge-v${version}-macos-universal.tar.gz" \
            -C stage local-browser-bridge "Local Computer Helper.app" LICENSE THIRD_PARTY_LICENSES.txt
          tar -tzf "dist/local-browser-bridge-v${version}-macos-universal.tar.gz" | LC_ALL=C sort > archive.txt
          test "$(wc -l < archive.txt | tr -d ' ')" = 10
      - name: Attest macOS build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble frozen release candidate
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          assets=(
            "local-browser-bridge-v${VERIFIED_VERSION}-windows-x86_64.exe"
            "local-computer-helper-v${VERIFIED_VERSION}-windows-x86_64.exe"
            "local-browser-bridge-v${VERIFIED_VERSION}-macos-universal.tar.gz"
            "local-browser-bridge-extension-v${VERIFIED_VERSION}.zip"
          )
          test "$(find dist -maxdepth 1 -type f ! -type l | wc -l | tr -d ' ')" = 4
          (cd dist && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          bash scripts/verify-release-assets.sh "$VERIFIED_VERSION" dist
      - name: Attest the checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS.txt
      - name: Verify exact-source GitHub build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        shell: bash
        run: |
          verify_attestation() {
            local subject="$1"
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --source-ref refs/heads/main \
                --source-digest "$VERIFIED_SOURCE_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
                --deny-self-hosted-runners; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          for subject in dist/*; do verify_attestation "$subject"; done
      - name: Freeze the candidate for desktop and browser acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
