name: Publish accepted release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact accepted package version (for example, 0.12.69)
        required: true
        type: string
      source_sha:
        description: Exact 40-character main commit used by the candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful Build release candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful candidate workflow run attempt
        required: true
        type: string
      dry_run:
        description: Rehearse preflight only; stop after the remote-conflict check without tagging or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify accepted candidate outside release environment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      administration: read
      attestations: read
      contents: read
    outputs:
      approval_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      approval_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      acceptance_receipt_sha256: ${{ steps.approval.outputs.acceptance_receipt_sha256 }}
      candidate_artifact_id: ${{ steps.candidate.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind publication to exact current main source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$VERIFIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_SHA" = "$VERIFIED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SOURCE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_SOURCE_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = HEAD
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          git diff --quiet HEAD --
          git diff --cached --quiet
          test -z "$(git ls-files --deleted)"
          test -z "$(git ls-files --others --exclude-standard)"
          git fsck --full
          if [[ -e RELEASE_BLOCKED || -L RELEASE_BLOCKED ]]; then
            echo "Release is blocked by RELEASE_BLOCKED." >&2
            exit 1
          fi
          version="$(bash scripts/audit-versions.sh "$RELEASE_VERSION")"
          test "$version" = "$RELEASE_VERSION"

      - name: Bind exact successful candidate workflow attempt
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          scratch="$(mktemp -d)"
          chmod 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT" \
            > "$scratch/run.json"
          jq -e \
            --arg source "$VERIFIED_SOURCE_SHA" \
            --argjson attempt "$CANDIDATE_RUN_ATTEMPT" '
              .event == "workflow_dispatch" and .head_branch == "main" and
              .head_sha == $source and .run_attempt == $attempt and
              .path == ".github/workflows/deploy.yml" and
              .status == "completed" and .conclusion == "success"
            ' "$scratch/run.json" >/dev/null
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            > "$scratch/artifacts.json"
          # `EXPR and (BOUND) as $x | if $x then VALUE else error end` is not
          # safe for extracting VALUE across jq versions: jq's `and`/`or`
          # always reduce to a plain boolean, so on jq < 1.8 (this job runs
          # on ubuntu-latest, confirmed jq 1.7) the `and` discards VALUE and
          # this would yield the literal string "true" instead of an
          # artifact ID. Bind `as` to a plain bracketed term and keep the
          # boolean check self-contained inside `if`, which is unambiguous
          # on every jq version.
          artifact_id="$(jq -er \
            --argjson run_id "$CANDIDATE_RUN_ID" \
            --arg source "$VERIFIED_SOURCE_SHA" '
              ([.artifacts[] | select(
                .name == "release-candidate" and .expired == false and
                .workflow_run.id == $run_id and .workflow_run.head_sha == $source
              )]) as $matches |
              if (.total_count < 100) and ($matches | length == 1) then
                $matches[0].id | tostring
              else error("candidate artifact is absent or ambiguous") end
            ' "$scratch/artifacts.json")"
          printf 'candidate_artifact_id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact candidate bytes and attestations
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.candidate_artifact_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/publication-preflight"
          test ! -e "$work"
          mkdir -m 700 "$work"
          bash scripts/fetch-verify-release-candidate.sh \
            "$RELEASE_VERSION" \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_RUN_ATTEMPT" \
            "$CANDIDATE_ARTIFACT_ID" \
            "$VERIFIED_SOURCE_SHA" \
            "$work/candidate"

      - name: Download and verify the attested CI acceptance receipt
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077
          work="$RUNNER_TEMP/publication-preflight"
          receipt_dir="$work/receipt"
          test ! -e "$receipt_dir"
          mkdir -m 700 "$receipt_dir"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            > "$receipt_dir/artifacts.json"
          # `EXPR and (BOUND) as $x | if $x then VALUE else error end` is not
          # safe for extracting VALUE across jq versions: jq's `and`/`or`
          # always reduce to a plain boolean, so on jq < 1.8 (this job runs
          # on ubuntu-latest, confirmed jq 1.7) the `and` discards VALUE and
          # this would yield the literal string "true" instead of an
          # artifact ID. Bind `as` to a plain bracketed term and keep the
          # boolean check self-contained inside `if`, which is unambiguous
          # on every jq version.
          receipt_artifact_id="$(jq -er \
            --argjson run_id "$CANDIDATE_RUN_ID" \
            --arg source "$VERIFIED_SOURCE_SHA" '
              ([.artifacts[] | select(
                .name == "acceptance-receipt" and .expired == false and
                .workflow_run.id == $run_id and .workflow_run.head_sha == $source
              )]) as $matches |
              if (.total_count < 100) and ($matches | length == 1) then
                $matches[0].id | tostring
              else error("acceptance receipt artifact is absent or ambiguous") end
            ' "$receipt_dir/artifacts.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$receipt_artifact_id/zip" > "$receipt_dir/receipt.zip"
          mkdir -m 700 "$receipt_dir/payload"
          unzip -q "$receipt_dir/receipt.zip" -d "$receipt_dir/payload"
          test "$(find "$receipt_dir/payload" -mindepth 1 | wc -l | tr -d ' ')" = 1
          receipt="$receipt_dir/payload/acceptance-receipt.json"
          test -f "$receipt" && test ! -L "$receipt"
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$receipt" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref refs/heads/main \
              --source-digest "$VERIFIED_SOURCE_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
              --deny-self-hosted-runners; then
              break
            fi
            test "$attempt" -lt 5 || exit 1
            sleep 2
          done
          candidate_binding="$work/candidate/candidate-binding.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$RELEASE_VERSION" \
            --arg source "$VERIFIED_SOURCE_SHA" \
            --arg run_id "$CANDIDATE_RUN_ID" \
            --arg run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg artifact_id "$(jq -r '.artifactId' "$candidate_binding")" \
            --arg zip_sha "$(jq -r '.artifactZipSha256' "$candidate_binding")" \
            --arg manifest_sha "$(jq -r '.checksumManifestSha256' "$candidate_binding")" '
              type == "object" and
              .schemaVersion == 4 and .repository == $repository and .version == $version and
              .sourceSha == $source and .workflowPath == ".github/workflows/deploy.yml" and
              .runId == $run_id and .runAttempt == $run_attempt and
              .candidateArtifactId == $artifact_id and .candidateArtifactSha256 == $zip_sha and
              .checksumManifestSha256 == $manifest_sha and
              (.results | keys) == ["macos", "windows"] and
              .results.macos.os == "macos" and .results.windows.os == "windows" and
              all(.results[];
                .ok == true and .mode == "artifact" and .version == $version and
                .sourceSha == $source and .runId == $run_id and .runAttempt == $run_attempt and
                .candidateArtifactId == $artifact_id and .candidateArtifactSha256 == $zip_sha and
                .computerMode == "native" and
                .lanes == ["server", "shell", "browser", "computer"] and
                .summary.fail == 0 and .summary.skip == 0 and .summary.total >= 47 and
                (.checks | length) > 0 and
                all(.checks[]; (.required | not) or .status == "pass"))
            ' "$receipt" >/dev/null
          cp -- "$receipt" "$work/acceptance-receipt.json"
          chmod 600 "$work/acceptance-receipt.json"
          jq -r '.results[] | "\(.os): \(.summary.pass) pass, \(.summary.skip) skip, computer mode \(.computerMode // "n/a")"' "$receipt"

      - name: Create immutable publication approval bundle
        id: approval
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh prepare \
            "$RUNNER_TEMP/publication-preflight/acceptance-receipt.json" \
            "$RUNNER_TEMP/publication-preflight/candidate" \
            "$RUNNER_TEMP/publication-approved"

      - name: Refuse a conflicting tag, draft, or published release before approval
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RECEIPT_SHA256: ${{ steps.approval.outputs.acceptance_receipt_sha256 }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh check-remote \
            "$RUNNER_TEMP/publication-approved" \
            "$EXPECTED_RECEIPT_SHA256"

      - name: Upload exact preflight-approved publication bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-approved/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 1

  release:
    name: Publish exact accepted release
    needs: preflight
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
    permissions:
      actions: read
      administration: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact approval artifact metadata
        env:
          APPROVAL_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.approval_artifact_digest }}
          APPROVAL_ARTIFACT_ID: ${{ needs.preflight.outputs.approval_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$APPROVAL_ARTIFACT_ID" > "$metadata"
          jq -e \
            --arg name "publication-approval-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg digest "sha256:$APPROVAL_ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg source "$VERIFIED_SOURCE_SHA" '
              .name == $name and .expired == false and .digest == $digest and
              (.size_in_bytes > 0 and .size_in_bytes <= 536870912) and
              .workflow_run.id == $run_id and .workflow_run.head_sha == $source
            ' "$metadata" >/dev/null
          rm -f -- "$metadata"

      - name: Download only the exact preflight-approved bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.approval_artifact_id }}
          path: ${{ runner.temp }}/publication-approved
          merge-multiple: true

      - name: Create or recover and verify immutable GitHub Release
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.preflight.outputs.acceptance_receipt_sha256 }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh publish \
            "$RUNNER_TEMP/publication-approved" \
            "$EXPECTED_RECEIPT_SHA256"
