version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    # Cargo treats 0.y.z minor bumps as breaking, so Dependabot reports them as
    # semver-major. Those need API migrations (rand, hmac, windows, ...) and are
    # handled by hand; only compatible bumps are grouped automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
