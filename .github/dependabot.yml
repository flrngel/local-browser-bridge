version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
